[project]

name = "building-perceptron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Philippe Laurens", email = "philippe.laurens@laplateforme.io" }
]
requires-python = ">=3.13"
dependencies = [
    "chardet>=5.2.0",
    "kaleido>=1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyprojroot>=0.3.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.65.0",
    "ucimlrepo>=0.0.7",
]

[project.scripts]
building-perceptron = "building_perceptron:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/building_perceptron"]
