[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "building-perceptron"
version = "0.2.0"
description = "Initiation to deep learning by coding a perceptron"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.0.0",
    "pandas>=3.0.0",
    "plotly>=6.6.0",
    "scikit-learn>=1.8.0",
    "streamlit>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.10",
]
