[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "building-perceptron"
version = "0.2.0"
description = "Initiation to deep learning by coding a perceptron"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.2.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "mlflow>=3.16.1",
    "nbformat>=5.10.4",
    "pandas>=3.0.0",
    "pathlib>=1.0.1",
    "plotly>=6.6.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
